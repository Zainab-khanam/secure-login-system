{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input type="text" name="username" required maxlength="20"></label>
  <label>Password <input type="password" name="password" required maxlength="128"></label>
  <button type="submit">Log in</button>
</form>
<p class="muted">No account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
